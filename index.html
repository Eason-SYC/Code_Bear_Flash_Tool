<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Bear Flasher - Professional ESP Web Tool</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/bear-logo.svg" type="image/svg+xml">
</head>
<body class="dark-mode">
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-area">
                    <i class="fas fa-paw logo-icon"></i>
                    <span class="logo-text">Code<span class="highlight">Bear</span></span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-view="dashboard">
                    <i class="fas fa-th-large"></i>
                    <span>Dashboard</span>
                </a>
                <a href="#" class="nav-item" data-view="terminal">
                    <i class="fas fa-terminal"></i>
                    <span>Console</span>
                </a>
                <a href="#" class="nav-item" data-view="monitor">
                    <i class="fas fa-desktop"></i>
                    <span>Monitor</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div id="theme-toggle" class="theme-toggle">
                    <i class="fas fa-moon"></i>
                    <span>Dark Mode</span>
                </div>
                <div class="version">v2.0.0</div>
                <footer class="sidebar-footer-text">
                    © 2026 Code Bear | Powered by <a href="https://github.com/espressif/esptool-js" target="_blank">esptool-js</a>
                </footer>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <div class="page-title">
                    <h1 id="view-title">Dashboard</h1>
                </div>
                <div class="connection-status" id="connection-status">
                    <span class="status-dot"></span>
                    <span class="status-text">Disconnected</span>
                </div>
                <div class="user-actions">
                    <button id="main-connect-btn" class="btn btn-primary">
                        <i class="fas fa-link"></i> Connect Device
                    </button>
                </div>
            </header>

            <div class="content-area">
                <!-- Dashboard View -->
                <section id="dashboard-view" class="view-section active">
                    <div class="dashboard-grid">
                        
                        <!-- Block 1: Device -->
                        <div class="grid-block">
                            <div class="block-header">
                                <h3><i class="fas fa-microchip"></i> 1. Select Device</h3>
                            </div>
                            <div class="card device-card clickable" id="device-card-clickable">
                                <div id="selected-device-display" class="empty-state">
                                    <div class="bear-placeholder"><i class="fas fa-paw"></i></div>
                                    <p>No device selected</p>
                                    <span class="click-hint">Click to Select Model</span>
                                </div>
                            </div>
                        </div>

                        <!-- Block 2: Firmware -->
                        <div class="grid-block">
                            <div class="block-header">
                                <h3><i class="fas fa-file-code"></i> 2. Firmware Settings</h3>
                            </div>
                            <div class="card firmware-card">
                                <div class="form-group">
                                    <label>Firmware Module</label>
                                    <select id="firmware-select" disabled><option value="">Choose a device first</option></select>
                                </div>
                                <div class="form-group">
                                    <label>Version / Sketch</label>
                                    <select id="version-select" disabled><option value="">Select version</option></select>
                                </div>
                            </div>
                        </div>

                        <!-- Block 3: Flash Zone (Wide Strip) -->
                        <div class="grid-block wide-block">
                            <div class="block-header">
                                <h3><i class="fas fa-bolt"></i> 3. Flash Zone</h3>
                            </div>
                            <div class="card flash-card-horizontal">
                                <div class="flash-strip-content">
                                    <!-- Left: Settings -->
                                    <div class="flash-settings-group">
                                        <div class="form-group inline-group">
                                            <label>Baud Rate</label>
                                            <select id="baud-rate-select">
                                                <option value="115200">115200</option>
                                                <option value="921600" selected>921600</option>
                                            </select>
                                        </div>
                                        <div class="erase-toggle-wrapper">
                                            <label class="toggle-switch">
                                                <input type="checkbox" id="erase-flash-checkbox" checked>
                                                <span class="slider"></span>
                                                <span class="label-text">Erase Flash</span>
                                            </label>
                                        </div>
                                    </div>

                                    <!-- Center: Circular Progress -->
                                    <div class="flash-progress-center">
                                        <div class="circle-container">
                                            <svg class="progress-ring" width="140" height="140">
                                                <circle class="progress-ring__circle-bg" stroke="rgba(255,255,255,0.05)" stroke-width="8" fill="transparent" r="64" cx="70" cy="70"/>
                                                <circle class="progress-ring__circle" id="progress-circle" stroke="var(--accent-primary)" stroke-width="8" stroke-dasharray="402.12" stroke-dashoffset="402.12" stroke-linecap="round" fill="transparent" r="64" cx="70" cy="70"/>
                                            </svg>
                                            <div class="circle-inner">
                                                <i class="fas fa-paw"></i>
                                                <span id="progress-percent">0%</span>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Right: Action -->
                                    <div class="flash-action-group">
                                        <div id="flash-status-msg" class="status-msg">Ready to flash?</div>
                                        <button id="flash-btn" class="btn btn-flash" disabled>
                                            <i class="fas fa-bolt"></i> START FLASHING
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </section>

                <!-- Console View -->
                <section id="terminal-view" class="view-section">
                    <div class="block-header">
                        <h3><i class="fas fa-terminal"></i> System Logs</h3>
                        <button class="btn-text" id="clear-console-btn"><i class="fas fa-trash"></i> Clear</button>
                    </div>
                    <div class="card terminal-card">
                        <div id="terminal-log" class="terminal-body"></div>
                    </div>
                </section>

                <!-- Monitor View -->
                <section id="monitor-view" class="view-section">
                    <div class="block-header">
                        <h3><i class="fas fa-desktop"></i> Serial Monitor</h3>
                        <div class="header-actions">
                            <div class="baud-group">
                                <label>Baud:</label>
                                <select id="modal-baud-rate-select" class="select-sm">
                                    <option value="9600">9600</option>
                                    <option value="115200" selected>115200</option>
                                    <option value="921600">921600</option>
                                </select>
                            </div>
                            <button class="btn-text" id="clear-monitor-btn"><i class="fas fa-trash"></i> Clear</button>
                        </div>
                    </div>
                    <div class="card monitor-card">
                        <div id="serial-monitor-terminal" class="monitor-body"></div>
                    </div>
                    <div class="monitor-input-area">
                        <input type="text" id="serial-send-input" placeholder="Type message...">
                        <button id="serial-send-btn" class="btn btn-primary btn-sm">Send</button>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Device Modal -->
    <div id="device-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-modal">&times;</button>
            <div class="modal-header">
                <h2>Select Your Device</h2>
            </div>
            <div class="modal-search">
                <i class="fas fa-search"></i>
                <input type="text" id="device-search" placeholder="Search boards...">
            </div>
            <div class="device-grid" id="device-list"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.1.1/crypto-js.js"></script>
    <script type="module" src="engine.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
